# Local preview overrides. Load after _config.yml (or run bin\serve.cmd).
# Keep full rebuilds: incremental mode can miss data/bibliography dependencies.
incremental: false

sass:
  style: expanded

# Jekyll replaces plugin arrays, so retain all plugins except the JS minifier.
plugins:
  - jekyll-archives-v2
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-tabs
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

# Also bypass HTML/CSS minification if JEKYLL_ENV was set to production.
jekyll-minifier:
  exclude: ["*"]

imagemagick:
  enabled: false

# These badges fetch remote citation counts during rendering.
enable_publication_badges:
  google_scholar: false
  inspirehep: false
